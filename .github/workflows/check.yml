name: Check site

# Fails when the committed pages are out of date with src/, or when a link, asset,
# anchor, meta tag or JSON-LD block is broken. GitHub Pages still deploys from main.
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generated files are up to date
        run: python tools/build.py --check
      - name: Static checks
        run: python tools/check.py
