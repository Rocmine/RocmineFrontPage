# GitHub Pages: publish only the built site. Sources, tooling, docs and originals stay in the repo.
exclude:
  - src
  - tools
  - docs
  - originals
  - node_modules
  - package.json
  - package-lock.json
  - README.md
  - .editorconfig

# dot-folders are skipped by default; security.txt must be published
include:
  - .well-known
